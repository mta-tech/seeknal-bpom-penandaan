name: TC_PND_KESIMPULAN_PENILAIAN_BALAI_011
scenario_id: TC-PND-KESIMPULAN-PENILAIAN-BALAI-011
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `kesimpulan_penilaian_balai`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan kesimpulan penilaian balai TMK MAYOR?'
  assert_contains:
  - 'TMK MAYOR'
  assert_any_of:
  -
    - '6.608'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE kesimpulan_penilaian_balai = ''TMK MAYOR'';
    
    HASIL DB 14Agu2026 = 6.608. KOLOM: `kesimpulan_penilaian_balai` di `mv_penandaan`. NILAI FILTER: ''TMK MAYOR'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
