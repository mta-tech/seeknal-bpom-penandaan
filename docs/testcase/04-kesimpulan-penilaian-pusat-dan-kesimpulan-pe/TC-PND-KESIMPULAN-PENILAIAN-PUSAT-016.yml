description: 'Cacah penandaan untuk satu nilai `kesimpulan_penilaian_pusat`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan kesimpulan penilaian pusat TMK MAYOR?'
  assert_contains:
  - 'TMK MAYOR'
  assert_any_of:
  -
    - '2.367'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE kesimpulan_penilaian_pusat = ''TMK MAYOR'';
    
    HASIL DB 14Agu2026 = 2.367. KOLOM: `kesimpulan_penilaian_pusat` di `mv_penandaan`. NILAI FILTER: ''TMK MAYOR'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
