name: TC_PND_KESIMPULAN_PENILAIAN_BALAI_012
scenario_id: TC-PND-KESIMPULAN-PENILAIAN-BALAI-012
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `kesimpulan_penilaian_balai`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan kesimpulan penilaian balai TMK Minor?'
  assert_contains:
  - 'TMK Minor'
  assert_any_of:
  -
    - '1.900'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE kesimpulan_penilaian_balai = ''TMK Minor'';
    
    HASIL DB 14Agu2026 = 1.900. KOLOM: `kesimpulan_penilaian_balai` di `mv_penandaan`. NILAI FILTER: ''TMK Minor'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
