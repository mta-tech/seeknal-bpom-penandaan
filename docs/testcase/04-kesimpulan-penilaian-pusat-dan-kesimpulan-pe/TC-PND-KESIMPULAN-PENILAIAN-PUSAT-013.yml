  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE kesimpulan_penilaian_pusat = ''MK'';
    
    HASIL DB 14Agu2026 = 151.855. KOLOM: `kesimpulan_penilaian_pusat` di `mv_penandaan`. NILAI FILTER: ''MK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
