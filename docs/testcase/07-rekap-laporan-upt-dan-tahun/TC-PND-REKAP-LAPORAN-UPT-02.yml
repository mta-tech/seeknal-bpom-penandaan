  note: 'SQL LENGKAP:
    SELECT nama_balai, COUNT(id) AS jumlah_laporan FROM mv_penandaan WHERE tgl_start >= ''2025-01-01'' AND tgl_end <= ''2025-12-31'' GROUP BY nama_balai;
    
    DATA YANG DITANYA: mv_penandaan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 77 baris; baris teratas ''BALAI BESAR POM DI BANDA ACEH'' dengan nilai 1.440.
    
    CATATAN URUTAN: SQL ini mengembalikan banyak baris tanpa ORDER BY. sehingga urutan barisnya TIDAK dijamin. Yang diperiksa adalah CACAH BARIS (77), bukan nilai pada baris tertentu. Bila jawaban perlu diurutkan, sebutkan kolom pengurutnya secara eksplisit.'
