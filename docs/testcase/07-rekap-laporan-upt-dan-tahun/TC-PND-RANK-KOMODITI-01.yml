name: TC_PND_RANK_KOMODITI_01
scenario_id: TC-PND-RANK-KOMODITI-01
verification_date: '2026-08-14'
description: 'Peringkat nilai `komoditi`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'komoditi apa yang paling banyak pada penandaan?'
  assert_contains:
  - 'KOSMETIKA'
  assert_any_of:
  -
    - '78.613'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT komoditi, COUNT(*) AS jumlah FROM mv_penandaan WHERE komoditi IS NOT NULL AND btrim(komoditi) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''KOSMETIKA'' dengan 78.613. KOLOM: `komoditi` di `mv_penandaan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(komoditi) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
