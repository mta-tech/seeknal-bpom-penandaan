name: TC_PND_BALAI_5789_2025
scenario_id: TC-PND-BALAI-5789-2025
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu balai pada satu tahun; menguji normalisasi nama balai dan filter periode.'
turns:
- prompt: 'berapa penandaan yang dilaporkan BALAI BESAR POM DI DENPASAR pada tahun 2025?'
  assert_contains:
  - 'BALAI BESAR POM DI DENPASAR'
  - '2025'
  assert_any_of:
  -
    - '2.281'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE btrim(nama_balai) = ''BALAI BESAR POM DI DENPASAR'' AND tgl_start >= ''2025-01-01'' AND tgl_start < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 2.281. NORMALISASI WAJIB: `btrim(nama_balai)` — sebagian nilai nama balai tersimpan dengan spasi menempel di ujung, sehingga filter kesamaan persis tanpa btrim bisa mengembalikan nol baris tanpa pesan kesalahan. DUA FILTER: balai dan periode; keduanya harus muncul di SQL final.'
