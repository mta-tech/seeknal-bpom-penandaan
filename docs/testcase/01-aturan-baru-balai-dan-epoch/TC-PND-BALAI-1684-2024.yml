name: TC_PND_BALAI_1684_2024
scenario_id: TC-PND-BALAI-1684-2024
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu balai pada satu tahun; menguji normalisasi nama balai dan filter periode.'
turns:
- prompt: 'berapa penandaan yang dilaporkan BALAI BESAR POM DI JAKARTA pada tahun 2024?'
  assert_contains:
  - 'BALAI BESAR POM DI JAKARTA'
  - '2024'
  assert_any_of:
  -
    - '3.507'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE btrim(nama_balai) = ''BALAI BESAR POM DI JAKARTA'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 3.507. NORMALISASI WAJIB: `btrim(nama_balai)` — sebagian nilai nama balai tersimpan dengan spasi menempel di ujung, sehingga filter kesamaan persis tanpa btrim bisa mengembalikan nol baris tanpa pesan kesalahan. DUA FILTER: balai dan periode; keduanya harus muncul di SQL final.'
