  note: 'JEBAKAN: SELECT MIN(tgl_start) FROM mv_penandaan_timeline mengembalikan 1970-01-01, dan itu BUKAN tanggal sebenarnya — ia penanda kosong. Jumlahnya 6.353 baris dari 500.891. Karena bertipe tanggal yang sah, nilai itu IKUT TERHITUNG: masuk MIN(), masuk selisih durasi (menghasilkan durasi puluhan ribu hari), dan menciptakan bucket tahun palsu pada tren. JAWABAN BENAR: mengenali 1970-01-01 sebagai penanda kosong dan menyebut tahun operasional sesungguhnya, ATAU menyatakan nilai itu tidak sahih. KENAPA MUDAH SALAH: v1 tidak menyebut apa pun tentang epoch. tolerance 0 karena assert tekstual.'
