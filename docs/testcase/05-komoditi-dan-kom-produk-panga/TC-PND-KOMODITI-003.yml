name: TC_PND_KOMODITI_003
scenario_id: TC-PND-KOMODITI-003
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi OBAT TRADISIONAL (OT)?'
  assert_contains:
  - 'OBAT TRADISIONAL (OT)'
  assert_any_of:
  -
    - '39.230'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''OBAT TRADISIONAL (OT)'';
    
    HASIL DB 14Agu2026 = 39.230. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''OBAT TRADISIONAL (OT)'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
