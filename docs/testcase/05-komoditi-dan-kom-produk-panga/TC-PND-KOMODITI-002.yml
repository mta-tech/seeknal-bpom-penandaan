name: TC_PND_KOMODITI_002
scenario_id: TC-PND-KOMODITI-002
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi OBAT?'
  assert_contains:
  - 'OBAT'
  assert_any_of:
  -
    - '53.221'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''OBAT'';
    
    HASIL DB 14Agu2026 = 53.221. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''OBAT'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
