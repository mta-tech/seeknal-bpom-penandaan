name: TC_PND_KOM_ROKOK_2025
scenario_id: TC-PND-KOM-ROKOK-2025
verification_date: '2026-08-14'
description: 'Silang komoditi dengan periode; menguji apakah kedua komponen pertanyaan masuk ke filter.'
turns:
- prompt: 'berapa penandaan komoditi ROKOK pada tahun 2025?'
  assert_contains:
  - 'ROKOK'
  - '2025'
  assert_any_of:
  -
    - '10.476'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''ROKOK'' AND tgl_start >= ''2025-01-01'' AND tgl_start < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 10.476. DUA FILTER SEKALIGUS: komoditi dan periode. Keduanya harus muncul di SQL final; komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap. NILAI KOMODITI: ''ROKOK'' — ejaan domain ini, tidak berlaku di domain lain.'
