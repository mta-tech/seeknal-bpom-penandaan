name: TC_PND_KOMODITI_001
scenario_id: TC-PND-KOMODITI-001
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi PRODUK PANGAN?'
  assert_contains:
  - 'PRODUK PANGAN'
  assert_any_of:
  -
    - '75.643'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''PRODUK PANGAN'';
    
    HASIL DB 14Agu2026 = 75.643. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''PRODUK PANGAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
