name: TC_PND_KOMODITI_000
scenario_id: TC-PND-KOMODITI-000
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi KOSMETIKA?'
  assert_contains:
  - 'KOSMETIKA'
  assert_any_of:
  -
    - '78.613'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''KOSMETIKA'';
    
    HASIL DB 14Agu2026 = 78.613. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''KOSMETIKA'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
