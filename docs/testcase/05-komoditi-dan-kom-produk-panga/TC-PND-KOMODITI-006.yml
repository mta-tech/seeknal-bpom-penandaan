name: TC_PND_KOMODITI_006
scenario_id: TC-PND-KOMODITI-006
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi OBAT KUASI?'
  assert_contains:
  - 'OBAT KUASI'
  assert_any_of:
  -
    - '2.690'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''OBAT KUASI'';
    
    HASIL DB 14Agu2026 = 2.690. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''OBAT KUASI'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
