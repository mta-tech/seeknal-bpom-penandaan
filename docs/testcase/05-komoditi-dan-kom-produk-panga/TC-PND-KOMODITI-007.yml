name: TC_PND_KOMODITI_007
scenario_id: TC-PND-KOMODITI-007
verification_date: '2026-08-14'
description: 'Cacah penandaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa penandaan dengan komoditi KEMASAN PANGAN?'
  assert_contains:
  - 'KEMASAN PANGAN'
  assert_any_of:
  -
    - '689'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''KEMASAN PANGAN'';
    
    HASIL DB 14Agu2026 = 689.
    
    KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER: ''KEMASAN PANGAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
