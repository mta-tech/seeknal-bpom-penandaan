name: TC_PND_KESIMPULA_596_2024
scenario_id: TC-PND-KESIMPULA-596-2024
verification_date: '2026-08-14'
description: 'Silang `kesimpulan_penilaian_pusat` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa penandaan dengan kesimpulan penilaian pusat VP pada tahun 2024?'
  assert_contains:
  - 'VP'
  - '2024'
  assert_any_of:
  -
    - '13.693'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE kesimpulan_penilaian_pusat = ''VP'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 13.693. KOLOM: `kesimpulan_penilaian_pusat` di `mv_penandaan`. NILAI FILTER ''VP'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
