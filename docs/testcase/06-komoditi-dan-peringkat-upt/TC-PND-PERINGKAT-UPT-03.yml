turns:
- prompt: 'tampilkan urutan data nama industri farmasi dengan hasil pengawasan akhir dari pusat yang memiliki obat dengan penandaan yang tidak memenuhi ketentuan paling banyak sampai dengan paling rendah.'
  assert_contains:
  - 'BERNOFARM   INDONESIA'
  assert_any_of:
  -
    - '3.646'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT produsen, COUNT(*) AS jumlah_tidak_memenuhi_ketentuan FROM mv_penandaan WHERE kesimpulan_penilaian_pusat = ''TMK'' GROUP BY produsen ORDER BY jumlah_tidak_memenuhi_ketentuan DESC;
    
    DATA YANG DITANYA: mv_penandaan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 6788 baris; baris teratas ''BERNOFARM INDONESIA'' dengan nilai 3.646.'
