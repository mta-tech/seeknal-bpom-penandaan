name: TC_PND_KOMODITI_365_2024
scenario_id: TC-PND-KOMODITI-365-2024
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa penandaan dengan komoditi OBAT pada tahun 2024?'
  assert_contains:
  - 'OBAT'
  - '2024'
  assert_any_of:
  -
    - '16.999'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_penandaan WHERE komoditi = ''OBAT'' AND tgl_start >= ''2024-01-01'' AND tgl_start < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 16.999. KOLOM: `komoditi` di `mv_penandaan`. NILAI FILTER ''OBAT'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
