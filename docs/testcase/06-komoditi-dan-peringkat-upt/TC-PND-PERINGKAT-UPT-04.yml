  assert_contains:
  - 'FUFANG SHILINTONG PIAN'
  assert_any_of:
  -
    - 'FUFANG SHILINTONG PIAN'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_produk FROM mv_penandaan WHERE lower(komoditi) IN (''obat tradisional (ot)'', ''suplemen kesehatan'', ''obat kuasi'') AND kesimpulan_penilaian_pusat = ''TMK'' GROUP BY nama_produk ORDER BY COUNT(*) DESC;
    
    DATA YANG DITANYA: mv_penandaan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 2589 baris; baris teratas ''FUFANG SHILINTONG PIAN''.'
